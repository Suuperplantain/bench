<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <title>Bench</title>
    <link rel="stylesheet" href="/orb-preview.css?v=repo-cards-3" />
    <script src="/vendor/html2canvas.min.js" defer></script>
    <script src="/orb-preview.js?v=repo-cards-3" type="module"></script>
  </head>
  <body>
    <main class="stage" aria-label="Bench">
      <div class="ambient" aria-hidden="true"></div>
      <section class="side-desk" id="side-desk" role="dialog" aria-label="Repositories" aria-modal="false" aria-hidden="true" tabindex="-1" inert>
        <div class="desk-interior">
          <div class="desk-topline">
            <span class="desk-brand">BENCH <span class="desk-count" id="repo-count"></span></span>
            <button class="desk-close" id="desk-close" type="button" aria-label="Minimise Bench">&minus;</button>
          </div>
          <div class="desk-body">
            <aside class="repo-rail" aria-label="Repositories">
              <div class="repo-list" id="repo-list" aria-live="polite"><p class="repo-message">Loading repositories…</p></div>
              <button class="repo-reload" id="repo-reload" type="button">Refresh list</button>
            </aside>
            <section class="workspace" aria-label="Repository conversation" hidden>
              <header class="workspace-header">
                <span class="workspace-label">CONVERSATION</span>
                <strong class="workspace-repo" id="workspace-repo">Choose a repository</strong>
              </header>
              <div class="conversation" id="conversation" aria-live="polite">
                <p class="conversation-empty">Pick a repository on the left to start working.</p>
              </div>
              <form class="composer" id="chat-form">
                <label class="sr-only" for="chat-input">Message Codex about this repository</label>
                <textarea id="chat-input" rows="1" maxlength="8000" placeholder="Choose a repository first" disabled></textarea>
                <button id="chat-send" type="submit" aria-label="Send message" disabled><span aria-hidden="true">↗</span></button>
              </form>
              <p class="chat-status" id="chat-status" role="status"></p>
            </section>
          </div>
        </div>
      </section>
      <button class="orb-launcher" id="orb-launcher" type="button" aria-label="Open Bench" aria-expanded="false" aria-controls="side-desk">
        <span class="orb-aura" aria-hidden="true"></span>
        <canvas class="corona" id="corona" aria-hidden="true"></canvas>
        <span class="void-motion" aria-hidden="true"></span>
        <span class="orb-core orb-face" data-look-range="2.5" aria-hidden="true">
          <span class="orb-eyes"><span class="orb-eye"></span><span class="orb-eye"></span></span>
        </span>
        <span class="orb-focus" aria-hidden="true"></span>
        <span class="void-caption" aria-hidden="true">VOID</span>
      </button>
      <p class="stage-hint" id="stage-hint">CLICK THE ORB</p>
    </main>
  </body>
</html>
